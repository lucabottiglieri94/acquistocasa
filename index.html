<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Nostra Casa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --dark: #1A1A18;
      --warm: #2C2C28;
      --gold: #C9A84C;
      --gold-light: #E8D5A3;
      --terracotta: #C4714A;
      --sage: #7A9E7E;
      --text: #2C2C28;
      --muted: #8A8578;
      --border: rgba(0,0,0,0.08);
      --white: #FDFCF9;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1f2224;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* NAVBAR */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      background: rgba(26,26,24,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-link {
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 8px 16px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: var(--gold); background: rgba(201,168,76,0.12); }

    #nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #nav-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: none;
    }

    #nav-login-btn {
      background: var(--gold);
      color: var(--dark);
      border: none;
      padding: 8px 18px;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    #nav-login-btn:hover { background: var(--gold-light); }

    #nav-logout-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      display: none;
    }

    #nav-logout-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* PAGES */
    .page { display: none; padding-top: 64px; }
    .page.active { display: block; }

    #page-home {
      background: var(--dark);
      min-height: 100vh;
    }

    #page-acquisto,
    #page-rendering,
    #page-budget,
    #page-contatti {
      background: transparent;
      min-height: 100vh;
    }

    /* HERO HOME */
    .hero {
      position: relative;
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 80px 24px;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 30%, rgba(196,113,74,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 80%, rgba(122,158,126,0.05) 0%, transparent 60%);
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .hero-content { position: relative; z-index: 1; text-align: center; max-width: 760px; }

    .hero-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 28px;
      padding: 6px 18px;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 100px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 400;
      color: var(--cream);
      line-height: 1.0;
      letter-spacing: -1px;
      margin-bottom: 24px;
    }

    .hero-title em { font-style: italic; color: var(--gold); }

    .hero-sub {
      font-size: 16px;
      color: rgba(245,240,232,0.5);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 52px;
      font-weight: 300;
    }

    .hero-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    .hero-card {
      background: rgba(245,240,232,0.04);
      border: 1px solid rgba(245,240,232,0.08);
      border-radius: 16px;
      padding: 28px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.06), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .hero-card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-4px); }
    .hero-card:hover::before { opacity: 1; }

    .hero-card-icon { font-size: 28px; margin-bottom: 14px; display: block; }
    .hero-card-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cream); margin-bottom: 6px; }
    .hero-card-desc { font-size: 12px; color: rgba(245,240,232,0.4); line-height: 1.6; font-weight: 300; }

    .hero-card-arrow {
      position: absolute;
      bottom: 20px; right: 20px;
      font-size: 16px;
      color: var(--gold);
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.3s;
    }

    .hero-card:hover .hero-card-arrow { opacity: 1; transform: translateX(0); }

    /* SECTION HEADER */
    .section-hero {
      background: var(--dark);
      padding: 72px 48px 56px;
      position: relative;
      overflow: hidden;
    }

    .section-hero::before {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-hero-tag {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px;
      display: block;
    }

    .section-hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 400;
      color: var(--cream);
      letter-spacing: -0.5px;
      max-width: 600px;
    }

    .section-hero-sub {
      margin-top: 12px;
      font-size: 14px;
      color: rgba(245,240,232,0.45);
      font-weight: 300;
    }

    /* Il resto del CSS (checklist, rendering, budget, contatti, modali, animazioni, responsive)
       è identico al file che hai già: puoi incollarlo qui sotto senza modifiche. */
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo" onclick="showPage('home')">La Nostra Casa</div>
  <div class="nav-links">
    <button class="nav-link active" onclick="showPage('home')">Home</button>
    <button class="nav-link" onclick="showPage('acquisto')">Acquisto Casa</button>
    <button class="nav-link" onclick="showPage('rendering')">Rendering</button>
    <button class="nav-link" onclick="showPage('budget')">Budget</button>
    <button class="nav-link" onclick="showPage('contatti')">Contatti</button>
  </div>
  <div id="nav-user">
    <img id="nav-avatar" src="" alt="" />
    <button id="nav-login-btn" onclick="loginGoogle()">Accedi</button>
    <button id="nav-logout-btn" onclick="logoutUser()">Esci</button>
  </div>
</nav>

     esattamente come nel tuo file paste.txt originale. -->

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBYhq-QtTNTN-9VlAiHyRpbgsfokiiqmw",
    authDomain: "acquisto-casa.firebaseapp.com",
    projectId: "acquisto-casa",
    storageBucket: "acquisto-casa.firebasestorage.app",
    messagingSenderId: "388374050359",
    appId: "1:388374050359:web:aa64fb5e5d4faa8aff71b2"
  };

  const AUTHORIZED_EMAILS = [
    "lucabottiglieri94@gmail.com"
  ];

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let saveTimer = null;

  window.appData = { checks: {}, budget: [], contacts: [] };

  window.loginGoogle = async () => {
    try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); }
  };

  window.logoutUser = async () => { await signOut(auth); };

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
      const isAuthorized = AUTHORIZED_EMAILS.includes(user.email);

      document.getElementById("nav-avatar").src = user.photoURL || "";
      document.getElementById("nav-avatar").style.display = "block";
      document.getElementById("nav-login-btn").style.display = "none";
      document.getElementById("nav-logout-btn").style.display = "block";

      if (!isAuthorized) {
        document.getElementById("login-wall").style.display = "none";
        document.getElementById("access-denied").style.display = "flex";
        document.getElementById("checklist-content").style.display = "none";
        return;
      }

      document.getElementById("login-wall").style.display = "none";
      document.getElementById("access-denied").style.display = "none";
      document.getElementById("checklist-content").style.display = "block";

      document.getElementById("user-avatar-bar").src = user.photoURL || "";
      document.getElementById("user-name-bar").textContent = user.displayName || user.email;

      await loadData(user.uid);
      renderBudget();
      renderContacts();
      updateProgress();
    } else {
      document.getElementById("nav-avatar").style.display = "none";
      document.getElementById("nav-login-btn").style.display = "block";
      document.getElementById("nav-logout-btn").style.display = "none";

      document.getElementById("login-wall").style.display = "flex";
      document.getElementById("access-denied").style.display = "none";
      document.getElementById("checklist-content").style.display = "none";

      window.appData = { checks: {}, budget: [], contacts: [] };
    }
  });

  async function loadData(uid) {
    const ref = doc(db, "users", uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const d = snap.data();
      window.appData.checks = d.checks || {};
      window.appData.budget = d.budget || [];
      window.appData.contacts = d.contacts || [];
      document.querySelectorAll(".check-item").forEach((item) => {
        if (window.appData.checks[item.dataset.id]) item.classList.add("checked");
        else item.classList.remove("checked");
      });
    }
  }

  function saveData() {
    if (!currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ref = doc(db, "users", currentUser.uid);
      await setDoc(ref, window.appData, { merge: true });
      const s = document.getElementById("save-status");
      if (s) {
        s.classList.add("visible");
        setTimeout(() => s.classList.remove("visible"), 2000);
      }
    }, 600);
  }

  window.saveData = saveData;

  window.toggleCheck = (item) => {
    item.classList.toggle("checked");
    window.appData.checks[item.dataset.id] = item.classList.contains("checked");
    updateProgress();
    saveData();
  };

  window.updateProgress = () => {
    const all = document.querySelectorAll(".check-item");
    const done = document.querySelectorAll(".check-item.checked");
    const pct = all.length ? Math.round((done.length / all.length) * 100) : 0;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-count").textContent = `${done.length} / ${all.length}`;
  };

  window.switchCTab = (name, btn) => {
    document.querySelectorAll(".c-section").forEach(s => s.classList.remove("visible"));
    document.getElementById("c-section-" + name).classList.add("visible");
    document.querySelectorAll(".c-tab").forEach(t => t.className = "c-tab");
    btn.classList.add("active-" + name);
  };

  // Budget, contatti, showPage come nella versione precedente (puoi incollare lo stesso codice che hai già).
</script>

</body>
</html>
